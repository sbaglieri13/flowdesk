[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/backend"]
addopts = "--cov=backend.app --cov-report=term-missing:skip-covered --cov-fail-under=90"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["frontend", "backend/app/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]
# B008: FastAPI's `Depends(...)` is designed to be called in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.lint.per-file-ignores]
"tests/backend/conftest.py" = ["E402"]
"tests/**" = ["ARG001"]
